# 🐳 Docker Compose - Environnement complet WatchBiz
# Tous les services nécessaires pour le développement et la production

version: '3.9'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: watchbiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchbiz_password}
      POSTGRES_DB: ${POSTGRES_DB:-watchbiz}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchbiz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watchbiz-network

  # ============================================
  # Redis Cache (optionnel - pour sessions/cache)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: watchbiz-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watchbiz-network

  # ============================================
  # Next.js Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: watchbiz-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-watchbiz}:${POSTGRES_PASSWORD:-watchbiz_password}@postgres:5432/${POSTGRES_DB:-watchbiz}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - watchbiz-network

  # ============================================
  # Nginx Reverse Proxy (Production)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: watchbiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - watchbiz-network

  # ============================================
  # Prisma Studio (Dev only)
  # ============================================
  prisma-studio:
    image: node:22-alpine
    container_name: watchbiz-prisma-studio
    working_dir: /app
    command: sh -c "npm install -g prisma && prisma studio --port 5555 --browser none"
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-watchbiz}:${POSTGRES_PASSWORD:-watchbiz_password}@postgres:5432/${POSTGRES_DB:-watchbiz}?schema=public
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - watchbiz-network
    profiles:
      - dev

# ============================================
# Volumes persistants
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local

# ============================================
# Network
# ============================================
networks:
  watchbiz-network:
    driver: bridge
