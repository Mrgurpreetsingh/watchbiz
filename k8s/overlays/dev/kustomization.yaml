apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: watchbiz-dev

bases:
  - ../../base

namePrefix: dev-

# Patch pour réduire les ressources en dev
patchesStrategicMerge:
  - deployment-patch.yaml

# Config spécifique dev
configMapGenerator:
  - name: watchbiz-config
    behavior: merge
    literals:
      - NODE_ENV=development

# Moins de réplicas en dev
replicas:
  - name: watchbiz-app
    count: 1
  - name: postgres
    count: 1
  - name: redis
    count: 1
