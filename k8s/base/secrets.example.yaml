# ⚠️ NE JAMAIS COMMIT CE FICHIER AVEC DE VRAIES VALEURS
# Utiliser Kubernetes Secrets ou un gestionnaire de secrets (Vault, Sealed Secrets)

apiVersion: v1
kind: Secret
metadata:
  name: watchbiz-secrets
  namespace: watchbiz
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "change-me-in-production"
  DATABASE_URL: "postgresql://watchbiz:change-me-in-production@postgres-service:5432/watchbiz?schema=public"

  # NextAuth
  NEXTAUTH_SECRET: "change-me-generate-with-openssl-rand-base64-32"
  NEXTAUTH_URL: "https://watchbiz.com"

  # Stripe
  STRIPE_SECRET_KEY: "sk_test_change_me"
  STRIPE_WEBHOOK_SECRET: "whsec_change_me"

  # Redis
  REDIS_PASSWORD: "change-me-in-production"
  REDIS_URL: "redis://:change-me-in-production@redis-service:6379"

---
