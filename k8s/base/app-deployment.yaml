apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchbiz-app
  namespace: watchbiz
  labels:
    app: watchbiz-app
spec:
  replicas: 3 # Haute disponibilité
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero downtime
  selector:
    matchLabels:
      app: watchbiz-app
  template:
    metadata:
      labels:
        app: watchbiz-app
        version: v1
    spec:
      # Init container pour migrations Prisma
      initContainers:
      - name: prisma-migrate
        image: watchbiz-app:latest # Remplacer par votre registry
        command:
        - sh
        - -c
        - npx prisma migrate deploy
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: watchbiz-secrets
              key: DATABASE_URL

      containers:
      - name: app
        image: watchbiz-app:latest # Remplacer par votre registry
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        # ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: watchbiz-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: watchbiz-config
              key: PORT
        - name: NEXT_TELEMETRY_DISABLED
          valueFrom:
            configMapKeyRef:
              name: watchbiz-config
              key: NEXT_TELEMETRY_DISABLED

        # Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: watchbiz-secrets
              key: DATABASE_URL
        - name: NEXTAUTH_URL
          valueFrom:
            secretKeyRef:
              name: watchbiz-secrets
              key: NEXTAUTH_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: watchbiz-secrets
              key: NEXTAUTH_SECRET
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: watchbiz-secrets
              key: REDIS_URL
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: watchbiz-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: watchbiz-secrets
              key: STRIPE_WEBHOOK_SECRET

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Probes pour Kubernetes
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Startup probe pour apps lentes au démarrage
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12 # 2 minutes max

      # Sécurité: utilisateur non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

---
apiVersion: v1
kind: Service
metadata:
  name: watchbiz-app-service
  namespace: watchbiz
  labels:
    app: watchbiz-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: watchbiz-app

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: watchbiz-app-hpa
  namespace: watchbiz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: watchbiz-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
