apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watchbiz-ingress
  namespace: watchbiz
  annotations:
    # Nginx Ingress Controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"

    # CORS (si nécessaire)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://watchbiz.com"

    # Cert-Manager pour SSL automatique
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # Body size (pour uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # Cache static assets
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

spec:
  tls:
  - hosts:
    - watchbiz.com
    - www.watchbiz.com
    secretName: watchbiz-tls

  rules:
  # Redirection www -> non-www
  - host: www.watchbiz.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: watchbiz-app-service
            port:
              number: 80

  # Domaine principal
  - host: watchbiz.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: watchbiz-app-service
            port:
              number: 80

---
# Certificate pour SSL automatique (Let's Encrypt)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: watchbiz-tls
  namespace: watchbiz
spec:
  secretName: watchbiz-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - watchbiz.com
  - www.watchbiz.com
