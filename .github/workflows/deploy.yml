name: Deploy to Production

on:
  push:
    branches: [main]
  # Allow manual deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Pre-deployment checks
  # ═══════════════════════════════════════════════════════════════
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check environment variables
        run: |
          echo "Checking required environment variables..."
          # Add your required env vars here
          required_vars=("DATABASE_URL" "NEXTAUTH_SECRET" "STRIPE_SECRET_KEY")
          for var in "${required_vars[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "❌ Missing required environment variable: $var"
              echo "Please add it to your deployment platform (Vercel/Railway/etc.)"
            else
              echo "✅ $var is set"
            fi
          done

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Deploy to Vercel (Production)
  # ═══════════════════════════════════════════════════════════════
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    timeout-minutes: 20
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ github.event.inputs.environment || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build ${{ github.event.inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event.inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { number: pull_number } = context.issue;
            const url = '${{ steps.deploy.outputs.url }}';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: `🚀 **Deployment successful!**\n\n**Preview URL:** ${url}\n\nEnvironment: ${{ github.event.inputs.environment || 'production' }}`
            });

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Database Migration (Production)
  # ═══════════════════════════════════════════════════════════════
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy-vercel
    timeout-minutes: 10
    # Only run for production deployments
    if: github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify migration status
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Post-deployment Tests (Smoke Tests)
  # ═══════════════════════════════════════════════════════════════
  post-deploy-smoke-tests:
    name: Smoke Tests on Production
    runs-on: ubuntu-latest
    needs: [deploy-vercel, migrate-database]
    timeout-minutes: 15
    if: always() && needs.deploy-vercel.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        run: npx playwright test tests/e2e/simple-smoke.spec.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.deploy-vercel.outputs.url || secrets.PRODUCTION_URL }}

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # Job 5: Notify Deployment Status
  # ═══════════════════════════════════════════════════════════════
  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-vercel, migrate-database, post-deploy-smoke-tests]
    if: always()

    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.deploy-vercel.result }}" == "success" ]] && \
             [[ "${{ needs.migrate-database.result }}" == "success" || "${{ needs.migrate-database.result }}" == "skipped" ]] && \
             [[ "${{ needs.post-deploy-smoke-tests.result }}" == "success" || "${{ needs.post-deploy-smoke-tests.result }}" == "skipped" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=Deployment completed successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "message=Deployment failed or had issues!" >> $GITHUB_OUTPUT
          fi

      - name: Create deployment summary
        run: |
          echo "## ${{ steps.status.outputs.emoji }} Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-deployment Checks | ${{ needs.pre-deploy-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vercel Deployment | ${{ needs.deploy-vercel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Migration | ${{ needs.migrate-database.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.post-deploy-smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      # Optional: Send Slack notification
      # - name: Send Slack notification
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     payload: |
      #       {
      #         "text": "${{ steps.status.outputs.emoji }} Deployment ${{ steps.status.outputs.status }}",
      #         "blocks": [
      #           {
      #             "type": "section",
      #             "text": {
      #               "type": "mrkdwn",
      #               "text": "*WatchBiz Deployment*\n${{ steps.status.outputs.message }}"
      #             }
      #           }
      #         ]
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ═══════════════════════════════════════════════════════════════
  # Job 6: Rollback on Failure (Optional)
  # ═══════════════════════════════════════════════════════════════
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy-vercel, post-deploy-smoke-tests]
    if: failure() && github.event.inputs.environment == 'production'
    timeout-minutes: 10

    steps:
      - name: Rollback to previous deployment
        run: |
          echo "⚠️ Deployment failed, initiating rollback..."
          echo "This would typically:"
          echo "  1. Revert Vercel deployment to previous version"
          echo "  2. Rollback database migrations (if safe)"
          echo "  3. Notify team of rollback"
          # Implement actual rollback logic here

      - name: Comment rollback on commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;

            await github.rest.repos.createCommitComment({
              owner,
              repo,
              commit_sha: sha,
              body: '⚠️ **Deployment Failed - Rollback Initiated**\n\nThe deployment to production failed smoke tests and has been rolled back.'
            });
