name: CI - Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Unit & Integration Tests
  # ═══════════════════════════════════════════════════════════════
  unit-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: watchbiz_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: watchbiz_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          cp .env.example .env.test
          echo "DATABASE_URL=postgresql://watchbiz_test:test_password@localhost:5432/watchbiz_test" >> .env.test
          echo "NEXTAUTH_SECRET=test_secret_min_32_characters_long_string_for_ci" >> .env.test
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env.test
          echo "STRIPE_SECRET_KEY=sk_test_mock" >> .env.test
          echo "STRIPE_WEBHOOK_SECRET=whsec_test_mock" >> .env.test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://watchbiz_test:test_password@localhost:5432/watchbiz_test

      - name: Seed test database (optional)
        run: npx prisma db seed || echo "No seed script found, skipping"
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://watchbiz_test:test_password@localhost:5432/watchbiz_test

      - name: Run Unit Tests
        run: npm run test:unit -- --reporter=verbose
        env:
          NODE_ENV: test

      - name: Run Integration Tests
        run: npm run test:integration -- --reporter=verbose
        env:
          NODE_ENV: test

      - name: Generate Coverage Report
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests,integrationtests
          name: unit-integration-coverage
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit-integration
          path: |
            coverage/
            test-results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Linting & Type Checking
  # ═══════════════════════════════════════════════════════════════
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint || echo "ESLint warnings detected, continuing..."
        continue-on-error: true

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Build Verification
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup build environment
        run: |
          cp .env.example .env.production
          echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" >> .env.production
          echo "NEXTAUTH_SECRET=build_secret_min_32_characters_long_string" >> .env.production
          echo "NEXTAUTH_URL=https://watchbiz.example.com" >> .env.production
          echo "STRIPE_SECRET_KEY=sk_test_placeholder" >> .env.production

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .next/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Security Audit
  # ═══════════════════════════════════════════════════════════════
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

  # ═══════════════════════════════════════════════════════════════
  # Job 5: Database Schema Validation
  # ═══════════════════════════════════════════════════════════════
  prisma-validation:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: Check Prisma Format
        run: npx prisma format --check

      - name: Check for pending migrations
        run: |
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Job 6: All Checks Passed
  # ═══════════════════════════════════════════════════════════════
  all-checks-passed:
    name: All Checks Passed ✅
    runs-on: ubuntu-latest
    needs:
      - unit-integration-tests
      - lint-typecheck
      - build
      - security-audit
      - prisma-validation
    if: always()

    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.unit-integration-tests.result }}" == "success" ]] && \
             [[ "${{ needs.lint-typecheck.result }}" == "success" ]] && \
             [[ "${{ needs.build.result }}" == "success" ]] && \
             [[ "${{ needs.prisma-validation.result }}" == "success" ]]; then
            echo "✅ All checks passed successfully!"
            exit 0
          else
            echo "❌ Some checks failed:"
            echo "  - Unit/Integration Tests: ${{ needs.unit-integration-tests.result }}"
            echo "  - Lint/TypeCheck: ${{ needs.lint-typecheck.result }}"
            echo "  - Build: ${{ needs.build.result }}"
            echo "  - Prisma Validation: ${{ needs.prisma-validation.result }}"
            exit 1
          fi
