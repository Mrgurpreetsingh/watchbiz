name: E2E Tests - Playwright

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual trigger
  workflow_dispatch:

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job: E2E Tests with Playwright
  # ═══════════════════════════════════════════════════════════════
  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Optionally test on different Node versions
        # node-version: ['18', '20']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: watchbiz_e2e
          POSTGRES_PASSWORD: e2e_password
          POSTGRES_DB: watchbiz_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Setup E2E environment
        run: |
          cp .env.example .env.test
          echo "DATABASE_URL=postgresql://watchbiz_e2e:e2e_password@localhost:5432/watchbiz_e2e" >> .env.test
          echo "NEXTAUTH_SECRET=e2e_secret_min_32_characters_long_string_for_ci" >> .env.test
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env.test
          echo "STRIPE_SECRET_KEY=sk_test_mock" >> .env.test
          echo "STRIPE_PUBLISHABLE_KEY=pk_test_mock" >> .env.test
          echo "STRIPE_WEBHOOK_SECRET=whsec_test_mock" >> .env.test
          echo "PLAYWRIGHT_TEST_BASE_URL=http://localhost:3000" >> .env.test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://watchbiz_e2e:e2e_password@localhost:5432/watchbiz_e2e

      - name: Seed E2E test database
        run: npx prisma db seed || echo "No seed script, skipping"
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://watchbiz_e2e:e2e_password@localhost:5432/watchbiz_e2e

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Playwright E2E Tests
        run: npx playwright test --project=${{ matrix.browser }} --reporter=html,list
        env:
          CI: true
          NODE_ENV: test
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Upload Screenshots & Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.browser }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # Job: E2E Summary
  # ═══════════════════════════════════════════════════════════════
  e2e-summary:
    name: E2E Tests Summary
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - name: Check E2E Results
        run: |
          echo "E2E Test Results:"
          echo "  - Chromium: ${{ needs.e2e-tests.result }}"

          if [[ "${{ needs.e2e-tests.result }}" == "success" ]]; then
            echo "✅ All E2E tests passed!"
            exit 0
          else
            echo "❌ E2E tests failed or were skipped"
            exit 1
          fi

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Comment PR with results (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const { number: pull_number } = context.issue;

            const result = process.env.E2E_RESULT;
            const status = result === 'success' ? '✅' : '❌';

            let comment = '## 🎭 E2E Test Results\n\n';
            comment += `**Status:** ${result}\n\n`;
            comment += '| Browser | Status |\n';
            comment += '|---------|--------|\n';
            comment += `| Chromium | ${status} |\n`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: comment
            });

  # ═══════════════════════════════════════════════════════════════
  # Job: Visual Regression Testing (Optional)
  # ═══════════════════════════════════════════════════════════════
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run on main/develop branches to compare
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: watchbiz_vr
          POSTGRES_PASSWORD: vr_password
          POSTGRES_DB: watchbiz_vr
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright with dependencies
        run: npx playwright install --with-deps chromium

      - name: Setup environment
        run: |
          cp .env.example .env.test
          echo "DATABASE_URL=postgresql://watchbiz_vr:vr_password@localhost:5432/watchbiz_vr" >> .env.test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://watchbiz_vr:vr_password@localhost:5432/watchbiz_vr

      - name: Build application
        run: npm run build

      - name: Run visual regression tests
        run: npx playwright test tests/e2e/visual/ --update-snapshots || echo "No visual tests found"
        continue-on-error: true

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/e2e/**/*.png
          retention-days: 30
